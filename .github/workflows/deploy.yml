name: Build and Deploy ML Service

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: brizzieh
  IMAGE_NAME: task-ml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify ML model files
        run: |
          echo "Category model:"
          ls -lh models/category_model/model.safetensors

          echo "Priority model:"
          ls -lh models/priority_model/model.safetensors

          echo "Category model size:"
          stat -c%s models/category_model/model.safetensors

          echo "Priority model size:"
          stat -c%s models/priority_model/model.safetensors

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ML Docker image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push ML Docker image
        run: |
          docker push \
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to ML EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Pulling latest ML image..."
            sudo docker pull brizzieh/task-ml:latest

            echo "Stopping old ML container..."
            sudo docker rm -f task-ml 2>/dev/null || true

            echo "Starting ML service..."
            sudo docker run -d \
              --name task-ml \
              --restart unless-stopped \
              -p 8001:8000 \
              brizzieh/task-ml:latest

            echo "Checking container..."
            sleep 10
            sudo docker ps --filter "name=task-ml"

            echo "Deployment completed!"